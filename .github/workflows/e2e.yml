name: e2e

# Additive to ci.yml, which delegates to the py-canon reusable workflow. Two
# things that workflow cannot check:
#
#   * that the package works with **no local artifacts** -- the configuration
#     every user and every runner is actually in;
#   * that the built **wheel** works, rather than the source tree (its wheel job
#     runs pytest from the repo root, where `import indicate` resolves to
#     ./indicate/, so the wheel is never really exercised).
#
# The third -- that the model repo still holds what the loader asks for -- lives
# in hf-contract.yml. It needs a tag trigger, and zizmor rightly treats a
# tag-triggered workflow as a publishing one, where a warm dependency cache is a
# poisoning vector. Splitting keeps that posture off the pull-request path.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only ever read the tree.
permissions:
  contents: read

jobs:
  contract:
    name: fresh clone, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config only widens
          # what a compromised step could exfiltrate.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Test with no artifacts and no network
        env:
          HF_HUB_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}/hf-empty
        # No weights, no lookup tables, no huggingface.co. Everything that does
        # not need an artifact must still pass, and nothing may error.
        run: uv run --frozen pytest tests --ignore=tests/gazetteer

  artifacts:
    name: with artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Cache model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hf
          # Keyed by revision: a bump refetches, an ordinary run does not.
          key: hf-${{ hashFiles('indicate/resources.py') }}
      - name: Build the lookup tables from the committed corpora
        run: |
          uv run --frozen --group train python training/build_lookup.py --lang hindi
          uv run --frozen --group train python training/build_lookup.py --lang punjabi
      - name: Test, failing rather than skipping on a missing artifact
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: uv run --frozen pytest tests --require-artifacts

  wheel:
    name: built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Build, install and exercise the wheel
        # `and not live`: a bare -m replaces the `-m "not live"` in addopts, so
        # without it this job would start making network calls.
        run: uv run --frozen pytest -m "e2e and not live"
