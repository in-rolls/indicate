[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "indicate"
description = "Transliterations to/from Indian languages"
readme = "README.md"
version = "0.9.0"
authors = [
    {name = "Rajashekar Chintalapati", email = "rajshekar.ch@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["transliterate", "indic", "hindi", "english"]
requires-python = ">=3.13"
dependencies = [
    "click>=8.0.0",
    "tqdm>=4.60.0",
    "numpy>=1.26",
    "torch>=2.6.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.23",  # lazy-download model weights at first use
    "litellm>=1.0.0",  # For LLM-based transliteration
    "google-genai>=1.0",  # native Gemini batch provider (indicate.batch)
]

[dependency-groups]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    "types-tqdm>=4.66",
    # [tool.pyright] includes gazetteer/, and gazetteer/phonetic.py imports
    # this. Without it here, `make type-check` after a plain `uv sync --dev`
    # reports a missing import that has nothing to do with the change in hand.
    # Named individually rather than pulling in the whole train group, which
    # carries pandas, matplotlib and datasets.
    "indic-transliteration>=2.3",
    # Same reason: gazetteer/mine_frequency.py imports pyarrow.parquet, and
    # pyright runs against a dev-group sync in CI.
    "pyarrow>=15",
    { include-group = "test" },
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
train = [
    "pandas>=2.0",
    "pyarrow>=15",
    "matplotlib>=3.7",
    "datasets>=2.18",
    # Mechanical Devanagari/Gurmukhi -> IAST, used by gazetteer/phonetic.py to
    # tell a romanization from a translation. Build-time only; never imported by
    # the installed package.
    "indic-transliteration>=2.3",
]

[project.urls]
Homepage = "https://github.com/in-rolls/indicate"
Repository = "https://github.com/in-rolls/indicate"

[project.scripts]
indicate = "indicate.cli:main"

# Ruff configuration
[tool.ruff]
line-length = 88
# Research artifacts in-repo are out of scope for package lint standards
extend-exclude = ["data", "examples", "scripts", "notebooks", "training"]
target-version = "py311"

[tool.ruff.lint]
allowed-confusables = ["ः", "–"]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
ignore = [
    "D203",
    "D213",
    "W191",
    "D206",
    "D300",
    # Transitional (adoption 2026-07): missing docstrings in legacy code — burn down
    "D1",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "D", "PT", "ARG", "SLF"]  # PT: legacy unittest-style tests (transitional)
"indicate/llm_indic.py" = ["E501"]  # long lines are prompt-template payload
"docs/**" = ["D"]
"gazetteer/**" = ["T201"]  # build scripts report progress on stdout by design

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=indicate",
    "--cov-report=term-missing",
    # Never reach the network on a default run.
    "-m",
    "not live",
]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
    "live: reaches the network; deselected by default, run with '-m live'",
    "e2e: builds and installs the wheel, or runs the console script",
    "needs_lookup: requires a built lookup table (training/build_lookup.py)",
    "needs_weights: requires model weights, locally or in the HF cache",
    "gazetteer: exercises gazetteer/, which ships in neither wheel nor sdist",
]
[tool.codespell]
ignore-words-list = "te"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs|data|examples|scripts|notebooks|training'

[tool.coverage.run]
source = ["indicate"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["indicate", "gazetteer"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.uv.build-backend]
module-name = "indicate"
module-root = ""
# Neither of these may ship. Weights are HF-hosted and lazy-downloaded. Lookup
# tables derive from data/hindi.csv.gz (which blends CC-BY-NC IIT Bombay pairs)
# and data/punjabi.csv.gz (from the restricted roll deposit), so redistributing
# them in an MIT wheel is a license problem, not a size one. Stated here rather
# than left to .gitignore, which the build backend does not read.
# tests/e2e/test_wheel_contents.py asserts it.
source-exclude = ["**/saved_weights/**", "**/lookup*.tsv.gz"]
wheel-exclude = ["**/saved_weights/**", "**/lookup*.tsv.gz"]
